<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="Description" content="Turn any device into a wireless microphone">
  <title>Wireless Microphone over the internet</title>
  <link rel="stylesheet" href="dist/bundle.css">
  <script type="module" src="dist/bundle.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="res/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="res/microphone-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="res/microphone-16x16.png">
  <link rel="manifest" href="site.webmanifest">
</head>
<body>
  <main x-data="webmic.root()" class="container">
    <template x-if="!showHelp">
      <div class="controls">
        <div class="segmented-control" role="radiogroup" aria-label="Device role">
          <template x-for="m in modes" :key="m">
            <div>
              <input type="radio" name="mode" :value="m" :id="m" :checked="mode === m" @change="setMode(m)" />
              <label :for="m" :class="`tab-${m}`"><span x-text="m"></span></label>
            </div>
          </template>
          <div :class="`segmented-control__color selected-${mode}`" aria-hidden="true"></div>
        </div>

        <template x-if="mode === 'microphone'">
          <div class="microphone">
            <div class="circle">
              <input type="checkbox" id="streaming" :checked="active" @change="toggle(); $el.checked = active" :aria-label="active ? 'Stop microphone' : 'Start microphone'" />
              <label for="streaming"><i class="material-icons" aria-hidden="true">mic_none</i></label>
              <span class="circle__back-1" aria-hidden="true"></span>
              <span class="circle__back-2" aria-hidden="true"></span>
            </div>
          </div>
        </template>
        <template x-if="mode === 'speaker'">
          <div class="speaker">
            <div class="circle">
              <input type="checkbox" id="listening" :checked="active" @change="toggle(); $el.checked = active" :aria-label="active ? 'Stop speaker' : 'Start speaker'" />
              <label for="listening"><i class="material-icons" aria-hidden="true">volume_up</i></label>
              <span class="circle__back-1" aria-hidden="true"></span>
              <span class="circle__back-2" aria-hidden="true"></span>
            </div>
          </div>
        </template>
        <div class="chip" role="status" aria-live="polite" aria-atomic="true">
          <div class="chip__icon"><i class="material-icons" x-text="stateIcon" aria-hidden="true"></i></div>
          <p x-text="status"></p>
        </div>
        <p class="error" role="alert" x-show="error" x-text="error" x-cloak></p>

        <template x-if="mode === 'microphone' && !active">
          <form class="pairing" @submit.prevent="applyPairing()">
            <label for="invitation">Private speaker link</label>
            <div class="pairing__entry">
              <input id="invitation" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" x-model="invitation" placeholder="Paste pairing link" required />
              <button type="submit">Pair</button>
            </div>
          </form>
        </template>
        <p class="pairing-note" x-show="mode === 'microphone' && paired" x-cloak>Speaker paired</p>
        <template x-if="mode === 'speaker' && state === 'waiting' && qrCode">
          <section class="pairing pairing--qr" aria-label="Pair your microphone">
            <p>Scan with your phone camera, then start the microphone.</p>
            <img :src="qrCode" alt="QR code for pairing a microphone with this speaker" width="192" height="192" />
            <label for="pairing-link">Private pairing link</label>
            <input id="pairing-link" type="text" :value="pairingLink" readonly @focus="$el.select()" />
            <button type="button" @click="copyPairing()" x-text="copied ? 'Link copied' : 'Copy link'"></button>
            <p class="pairing-note">Keep this link private. Anyone with it can connect.</p>
          </section>
        </template>
      </div>
    </template>
    <template x-if="showHelp">
      <div class="help" tabindex="0" aria-label="How to use Web Microphone">
        <p><strong>Web Microphone</strong> sends microphone audio to another device using your web browser.</p>
        <h1>How to use it?</h1>
        <p>On the device that will play the audio, select <strong>speaker</strong> and tap the large speaker button. Keep this page open while it shows a pairing QR code.</p>
        <p>Scan the QR code with your phone camera and open the link. Or copy the private pairing link, open this app on your microphone device, paste the link and press <strong>Pair</strong>.</p>
        <p>Tap the large <strong>microphone</strong> button and allow microphone access. The status below the button shows when audio is connected. Tap either large button again to stop, including while connecting.</p>
        <h1>Is it safe?</h1>
        <p>Audio uses encrypted iroh connections through relay servers. A direct device-to-device connection is not guaranteed. Only share the pairing link or QR code with the microphone you want to connect: the link is a secret that grants access to this speaker.</p>
        <h1>Sound and delay</h1>
        <p>Keep the microphone away from the speaker or use headphones to avoid feedback. Network and Bluetooth audio can add delay; this app does not remove it.</p>
      </div>
    </template>

    <div class="icon">
      <a href="https://github.com/rnbguy/webmic" target="_blank" rel="noopener" title="Source code on GitHub" aria-label="Source code on GitHub">
        <div class="icon__github"><i class="fab fa-github" aria-hidden="true"></i></div>
      </a>
      <a href="https://twitter.com/suda" target="_blank" rel="noopener" title="Original creator on Twitter" aria-label="Original creator on Twitter">
        <div class="icon__twitter"><i class="fab fa-twitter" aria-hidden="true"></i></div>
      </a>
      <a href="https://www.producthunt.com/@suda" target="_blank" rel="noopener" title="Original creator on Product Hunt" aria-label="Original creator on Product Hunt">
        <div class="icon__ph"><i class="fab fa-product-hunt" aria-hidden="true"></i></div>
      </a>
      <button type="button" @click="toggleHelp()" :aria-pressed="showHelp" :aria-label="showHelp ? 'Close help' : 'Open help'">
        <div :class="showHelp ? 'icon__help pressed' : 'icon__help'"><i class="fas fa-question-circle" aria-hidden="true"></i></div>
      </button>
    </div>
  </main>
</body>
</html>
